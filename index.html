<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทายใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;900&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root {
  --bg:     #07090f;
  --surf:   #0f1220;
  --surf2:  #161b2e;
  --border: rgba(255,255,255,.07);
  --text:   #eceef8;
  --muted:  #6b729a;
  --red:    #ff3f5b;
  --purple: #8b77ff;
  --gold:   #ffc744;
  --green:  #29e07a;
  color-scheme: dark;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: 'Sarabun', sans-serif; font-size: 16px;
  min-height: 100%; overscroll-behavior: none;
}
body {
  padding-top:    max(env(safe-area-inset-top,0px), 0px);
  padding-bottom: max(env(safe-area-inset-bottom,0px), 0px);
}
#app { max-width: 480px; margin: 0 auto; }

/* ── Screens ── */
.screen {
  display: none; flex-direction: column;
  min-height: 100svh;
  padding: 24px max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
}
.screen.active { display: flex; }

/* ── Typography ── */
.game-logo {
  font-family: 'Kanit', sans-serif; font-weight: 900;
  font-size: clamp(2.4rem,10vw,3.2rem); line-height: 1; letter-spacing: -.01em;
  background: linear-gradient(130deg, var(--gold) 0%, var(--purple) 60%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.screen-title {
  font-family: 'Kanit', sans-serif; font-weight: 700;
  font-size: 1.35rem; color: var(--text); text-wrap: balance; margin-bottom: 6px;
}
.screen-desc { font-size: .88rem; color: var(--muted); margin-bottom: 20px; line-height: 1.55; }
.section-label {
  font-size: .68rem; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}

/* ── Buttons ── */
.btn {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: transform .12s, opacity .12s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); opacity: .85; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn-green  { background: var(--green);  color: #07090f; }
.btn-red    { background: var(--red);    color: #fff; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-gold   { background: var(--gold);   color: #07090f; }
.btn-ghost  {
  background: var(--surf2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Sarabun', sans-serif; font-weight: 600;
}
.btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 20px; }

/* ── Inputs ── */
.input-group { margin-bottom: 14px; }
.input-group label {
  display: block; font-size: .75rem; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
input[type=text], textarea {
  width: 100%; padding: 13px 14px;
  background: var(--surf); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 1rem;
  outline: none; transition: border-color .15s;
  -webkit-appearance: none;
}
input[type=text]:focus, textarea:focus { border-color: var(--purple); }
input::placeholder, textarea::placeholder { color: var(--muted); }
textarea { resize: none; min-height: 70px; line-height: 1.5; }

/* ── Code display ── */
.room-code-box {
  background: var(--surf); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px 20px; display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 16px;
}
.room-code {
  font-family: 'Kanit', sans-serif; font-weight: 900;
  font-size: 2rem; letter-spacing: .15em; color: var(--purple);
}
.copy-btn {
  background: var(--surf2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 14px; color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer;
}

/* ── Player cards ── */
.player-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surf); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 8px;
}
.player-card.offline { opacity: .5; }
.player-av {
  width: 42px; height: 42px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0;
}
.player-name { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: .95rem; }
.player-sub  { font-size: .75rem; color: var(--muted); margin-top: 1px; }
.player-dot  { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
.pbadge {
  font-size: .68rem; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  background: rgba(139,119,255,.12); border: 1px solid rgba(139,119,255,.25); color: var(--purple);
  white-space: nowrap; flex-shrink: 0;
}
.pbadge.host { background: rgba(255,199,68,.12); border-color: rgba(255,199,68,.25); color: var(--gold); }
.me-tag { font-size: .72rem; color: var(--muted); font-weight: 400; }

/* ── Avatar grid ── */
.avatar-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px;
}
.av-btn {
  aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; cursor: pointer; transition: transform .1s;
  background: var(--surf2);
}
.av-btn.sel { border-color: var(--purple); transform: scale(1.08); }

/* ── Score opts ── */
.score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.score-row label { font-size: .86rem; color: var(--muted); flex-shrink: 0; }
.score-opts { display: flex; gap: 7px; }
.score-opt {
  padding: 6px 14px; border-radius: 20px;
  background: var(--surf2); border: 1px solid var(--border);
  color: var(--muted); font-weight: 600; font-size: .88rem; cursor: pointer;
  transition: all .12s;
}
.score-opt.sel {
  background: rgba(139,119,255,.15); border-color: rgba(139,119,255,.35);
  color: var(--purple);
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: max(28px, env(safe-area-inset-bottom,28px)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surf2); border: 1px solid var(--border); border-radius: 20px;
  padding: 10px 20px; font-size: .88rem; color: var(--text);
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  white-space: nowrap; z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Loading screen ── */
#s-loading { align-items: center; justify-content: center; gap: 14px; }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--purple);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Back button ── */
.back-btn {
  background: none; border: none; color: var(--muted); font-size: .88rem;
  cursor: pointer; padding: 0; margin-bottom: 16px; align-self: flex-start;
}

/* ── Setter input screen ── */
.hint-card {
  background: var(--surf); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; margin-bottom: 10px;
}
.hint-level {
  font-family: 'Kanit', sans-serif; font-weight: 700; font-size: .78rem;
  letter-spacing: .05em; margin-bottom: 8px;
}
.hint-level.lv1 { color: var(--red); }
.hint-level.lv2 { color: var(--gold); }
.hint-level.lv3 { color: var(--green); }

/* ── Wait screen ── */
.wait-box {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; text-align: center;
  padding: 24px 0;
}
.wait-avatar {
  width: 72px; height: 72px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
}
.wait-name { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 1.3rem; }
.wait-sub  { font-size: .88rem; color: var(--muted); }
.dots-anim::after {
  content: ''; animation: dots 1.2s steps(4, end) infinite;
}
@keyframes dots {
  0%,20%  { content: ''; }
  40%     { content: '.'; }
  60%     { content: '..'; }
  80%,100%{ content: '...'; }
}

/* ── Playing screen ── */
.round-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.timer-display {
  font-family: 'Kanit', sans-serif; font-weight: 900;
  font-size: 2.4rem; line-height: 1; text-align: center;
}
.timer-display.urgent { color: var(--red); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .5; } }
.hint-reveal-card {
  background: var(--surf); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; margin-bottom: 10px; transition: border-color .3s;
}
.hint-reveal-card.active { border-color: rgba(255,199,68,.4); background: rgba(255,199,68,.05); }
.hint-reveal-card.locked {
  opacity: .4; border-style: dashed;
}
.hint-reveal-label { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.hint-reveal-text { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); }
.hint-phase-pill {
  font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ── Setter confirm panel ── */
.confirm-panel {
  background: var(--surf); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px; margin-bottom: 10px;
}
.confirm-title { font-size: .75rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.confirm-player {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--surf2); border: 1px solid var(--border); border-radius: 11px;
  margin-bottom: 7px; cursor: pointer; transition: border-color .12s, transform .1s;
}
.confirm-player:active { transform: scale(.98); border-color: var(--green); }
.confirm-player-av {
  width: 36px; height: 36px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
}
.confirm-player-name { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: .9rem; }

/* ── Round result ── */
.result-verdict {
  text-align: center; padding: 24px 20px; margin-bottom: 16px;
  background: var(--surf); border: 1px solid var(--border); border-radius: 20px;
}
.result-verdict-emoji { font-size: 3rem; margin-bottom: 8px; }
.result-verdict-title {
  font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 1.5rem; margin-bottom: 4px;
}
.result-label {
  font-size: .75rem; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 20px; display: inline-block;
  margin-top: 6px;
}
.result-label.genius { background: rgba(139,119,255,.15); border: 1px solid rgba(139,119,255,.3); color: var(--purple); }
.result-label.tricked { background: rgba(255,199,68,.12); border: 1px solid rgba(255,199,68,.3); color: var(--gold); }
.result-score-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: 11px;
  background: var(--surf2); margin-bottom: 8px; font-size: .88rem;
}
.score-delta { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 1rem; }
.score-delta.plus  { color: var(--gold); }
.score-delta.minus { color: var(--red); }
.score-delta.zero  { color: var(--muted); }
.hint-reveal-row {
  display: flex; gap: 8px; margin-bottom: 10px; flex-direction: column;
}
.hint-mini {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--surf2); border-radius: 10px; padding: 10px 12px;
}
.hint-mini-lv { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: .78rem; min-width: 20px; }
.hint-mini-txt { font-size: .88rem; color: var(--text); line-height: 1.4; }

/* ── Score list ── */
.score-row-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.score-row-item:last-child { border-bottom: none; }
.score-rank { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 1.1rem; min-width: 28px; color: var(--muted); }
.score-pts  { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 1.3rem; color: var(--gold); margin-left: auto; font-variant-numeric: tabular-nums; }

/* ── End screen ── */
.winner-banner {
  text-align: center; padding: 24px 20px 20px;
  background: linear-gradient(135deg, rgba(255,199,68,.08), rgba(139,119,255,.08));
  border: 1px solid rgba(255,199,68,.2); border-radius: 20px; margin-bottom: 16px;
}
.end-rank-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--surf); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 8px;
}
.end-rank-row.winner-row { border-color: rgba(255,199,68,.3); background: rgba(255,199,68,.05); }
.rank-medal { font-size: 1.3rem; min-width: 28px; }
.end-player-name { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: .95rem; }
.end-score-num { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 1.4rem; margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ── Object reveal (round result) ── */
.object-card {
  background: linear-gradient(135deg, rgba(139,119,255,.1), rgba(255,63,91,.06));
  border: 1px solid rgba(139,119,255,.2); border-radius: 16px;
  padding: 18px; text-align: center; margin-bottom: 14px;
}
.object-label { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.object-text { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 1.8rem; color: var(--purple); }

/* ── Progress bar (timer) ── */
.timer-bar-wrap { height: 4px; background: var(--surf2); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
.timer-bar { height: 100%; background: var(--gold); border-radius: 2px; transition: width .5s linear, background .5s; }
.timer-bar.urgent { background: var(--red); }
</style>
</head>
<body>
<div id="app">

  <!-- LOADING -->
  <div class="screen active" id="s-loading">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
      <div class="spinner"></div>
      <div id="loading-status" style="font-size:.88rem;color:var(--muted)">กำลังเชื่อมต่อ...</div>
      <div id="loading-error" hidden style="background:rgba(255,63,91,.08);border:1px solid rgba(255,63,91,.25);border-radius:14px;padding:16px 20px;max-width:300px;font-size:.85rem;line-height:1.65;color:var(--text);text-align:center"></div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="s-home">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center">
      <div style="font-size:3.5rem;margin-bottom:16px">🤔</div>
      <div class="game-logo">ทายใจ</div>
      <div style="font-size:.88rem;color:var(--muted);margin-top:8px;margin-bottom:40px">ใครกำหนด?</div>
    </div>
    <div class="btn-stack" style="margin-top:0">
      <button class="btn btn-purple" onclick="goCreate()">✨ สร้างห้องใหม่</button>
      <button class="btn btn-ghost" onclick="showScreen('s-join')">🔑 เข้าร่วมห้อง</button>
    </div>
  </div>

  <!-- JOIN -->
  <div class="screen" id="s-join">
    <button class="back-btn" onclick="showScreen('s-home')">← กลับ</button>
    <div class="screen-title">🔑 เข้าร่วมห้อง</div>
    <div class="screen-desc">ขอรหัสห้องจากเพื่อนที่สร้างไว้</div>
    <div class="input-group">
      <label>รหัสห้อง</label>
      <input id="join-code" type="text" maxlength="6" placeholder="XXXXXX"
             oninput="this.value=this.value.toUpperCase()"
             style="text-transform:uppercase;letter-spacing:.15em;font-size:1.3rem;text-align:center;font-family:'Kanit',sans-serif;font-weight:700">
    </div>
    <div class="btn-stack" style="margin-top:0">
      <button class="btn btn-purple" onclick="goJoin()">เข้าร่วม</button>
    </div>
  </div>

  <!-- PROFILE -->
  <div class="screen" id="s-profile">
    <div class="screen-title" id="profile-title">👤 ตั้งชื่อ & Avatar</div>
    <div class="input-group">
      <label>ชื่อของคุณ</label>
      <input id="name-input" type="text" maxlength="12" placeholder="ชื่อในเกม...">
    </div>
    <div class="section-label">เลือก Avatar</div>
    <div class="avatar-grid" id="avatar-grid"></div>
    <div class="btn-stack" style="margin-top:0">
      <button class="btn btn-purple" id="profile-btn" onclick="submitProfile()">ถัดไป →</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="s-lobby">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div class="screen-title" style="margin-bottom:2px">🏠 ห้องรอ</div>
        <div id="lobby-count" style="font-size:.8rem;color:var(--muted)">0/8 คน</div>
      </div>
      <div class="room-code" style="font-size:1.5rem" id="lobby-code-display">------</div>
    </div>
    <div class="room-code-box" style="margin-bottom:12px">
      <div>
        <div style="font-size:.7rem;color:var(--muted);margin-bottom:3px">รหัสห้อง</div>
        <div class="room-code" id="lobby-room-code">------</div>
      </div>
      <button class="copy-btn" onclick="copyCode()">📋 คัดลอก</button>
    </div>
    <div class="score-row" id="score-row">
      <label>เป้าหมาย</label>
      <div class="score-opts">
        <div class="score-opt" onclick="setScore(10,this)">10</div>
        <div class="score-opt sel" onclick="setScore(15,this)">15</div>
        <div class="score-opt" onclick="setScore(20,this)">20</div>
      </div>
    </div>
    <div class="section-label">ผู้เล่น</div>
    <div id="lobby-players"></div>
    <div id="lobby-hint" style="text-align:center;font-size:.82rem;color:var(--muted);margin-top:8px"></div>
    <div class="btn-stack">
      <button class="btn btn-green" id="start-btn" hidden onclick="startGame()">▶ เริ่มเกม</button>
      <button class="btn btn-ghost" onclick="leaveRoom()" style="font-size:.85rem;padding:11px">ออกจากห้อง</button>
    </div>
  </div>

  <!-- SETTER INPUT -->
  <div class="screen" id="s-setter-input">
    <div id="setter-input-content"></div>
  </div>

  <!-- PLAYING -->
  <div class="screen" id="s-playing">
    <div id="playing-content"></div>
  </div>

  <!-- ROUND RESULT -->
  <div class="screen" id="s-round-result">
    <div id="round-result-content"></div>
  </div>

  <!-- END -->
  <div class="screen" id="s-end">
    <div id="end-content"></div>
  </div>

</div><!-- /#app -->

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
// ═══════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBMKDRyDXmHNG73L1RU05K8z8PZ72yTuL0",
  authDomain:        "trap-word.firebaseapp.com",
  databaseURL:       "https://trap-word-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "trap-word",
  storageBucket:     "trap-word.firebasestorage.app",
  messagingSenderId: "183057713461",
  appId:             "1:183057713461:web:298430a7667a2ed41ee47c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ─── State ──────────────────────────────────────
let myUid       = null;
let myName      = '';
let myAvatar    = '🐶';
let myAvatarBg  = '#1a1a2e';
let roomId      = null;
let roomRef     = null;
let isHost      = false;
let roomSnap    = null;
let scoreTarget = 15;
let profileMode = 'create'; // 'create' | 'join'
let joinCodePending = '';

let roundTimer      = null;
let reveal2Pending  = false;
let reveal3Pending  = false;
let timeoutPending  = false;
let roundEndPending = false;

// ─── Avatars ─────────────────────────────────────
const AVATARS = [
  ['🐶','#1a1a2e'],['🐱','#1a2820'],['🦊','#2a1a0e'],['🐺','#1e1a2a'],['🐻','#1e1a16'],
  ['🐯','#2a1a0e'],['🦁','#2a2010'],['🐮','#162a1a'],['🐷','#2a1620'],['🐸','#102a16'],
  ['🐧','#101a2a'],['🦉','#1a1a2a'],['🐲','#0e2a1a'],['🦋','#1a102a'],['🦄','#2a1020'],
];

// ─── Utilities ───────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); window.scrollTo(0, 0); }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return 'GM' + Array.from({length: 4}, () => c[Math.floor(Math.random() * c.length)]).join('');
}

function saveSession() {
  try {
    sessionStorage.setItem('gm_session', JSON.stringify({ roomId, myName, myAvatar, myAvatarBg }));
  } catch(e) {}
}

function loadSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem('gm_session') || 'null');
    if (s) { roomId = s.roomId; myName = s.myName; myAvatar = s.myAvatar; myAvatarBg = s.myAvatarBg; }
  } catch(e) {}
}

function clearSession() {
  try { sessionStorage.removeItem('gm_session'); } catch(e) {}
}

function playerObj() {
  return { name: myName, avatar: myAvatar, avatarBg: myAvatarBg, score: 0, online: true };
}

function getCurrentSetter() {
  if (!roomSnap) return null;
  const order = roomSnap.setterOrder || [];
  const idx   = roomSnap.currentSetterIdx || 0;
  return order[idx % order.length] || null;
}

function calcScore(winnerLevel) {
  if (!winnerLevel) return { guesserScore: 0, setterScore: 5, gLabel: '', sLabel: '🏆 หลอกทุกคนสำเร็จ!' };
  if (winnerLevel === 1) return { guesserScore: 5, setterScore: -2, gLabel: '🧠 เก่งเกิน!', sLabel: 'ง่ายเกินไป' };
  if (winnerLevel === 2) return { guesserScore: 3, setterScore: -1, gLabel: '🧠 เก่งเกิน!', sLabel: 'ง่ายเกินไป' };
  if (winnerLevel === 3) return { guesserScore: 1, setterScore: 0,  gLabel: '🧠 เก่งเกิน!', sLabel: '' };
  return { guesserScore: 0, setterScore: 0, gLabel: '', sLabel: '' };
}

// ─── Build avatar grid ────────────────────────────
function buildAvatarGrid() {
  const grid = document.getElementById('avatar-grid');
  if (!grid) return;
  grid.innerHTML = '';
  AVATARS.forEach(([emoji, bg], i) => {
    const btn = document.createElement('div');
    btn.className = 'av-btn' + (emoji === myAvatar ? ' sel' : '');
    btn.style.background = bg;
    btn.textContent = emoji;
    btn.onclick = () => {
      myAvatar = emoji; myAvatarBg = bg;
      grid.querySelectorAll('.av-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    };
    grid.appendChild(btn);
  });
}

// ─── Auth & init ──────────────────────────────────
const isPlaceholder = firebaseConfig.apiKey === 'YOUR_API_KEY';
if (isPlaceholder) {
  document.getElementById('loading-spinner')?.remove();
  const e = document.getElementById('loading-error');
  e.hidden = false;
  e.innerHTML = '⚠️ <strong>ยังไม่ได้ตั้งค่า Firebase Config</strong><br><br>ใส่ค่าจริงใน firebaseConfig';
} else {
  auth.signInAnonymously().then(async cred => {
    myUid = cred.user.uid;
    buildAvatarGrid();
    loadSession();
    if (roomId) {
      const snap = await db.ref(`gm_rooms/${roomId}`).once('value');
      if (snap.exists() && snap.val().players?.[myUid]) {
        roomRef = db.ref(`gm_rooms/${roomId}`);
        setupPresence();
        listenRoom();
        return;
      }
    }
    roomId = null; clearSession(); showScreen('s-home');
  }).catch(err => {
    document.getElementById('loading-status').hidden = true;
    const e = document.getElementById('loading-error');
    e.hidden = false; e.textContent = 'เชื่อมต่อไม่ได้: ' + err.message;
  });
}

function setupPresence() {
  if (!roomRef) return;
  const presRef = roomRef.child(`players/${myUid}/online`);
  presRef.set(true);
  presRef.onDisconnect().set(false);
}

// ─── Room listener ────────────────────────────────
function listenRoom() {
  if (!roomRef) return;
  roomRef.on('value', snap => {
    if (!snap.exists()) { toast('ห้องถูกลบแล้ว'); doLeave(); return; }
    const prev = roomSnap;
    roomSnap = snap.val();
    isHost   = roomSnap.host === myUid;
    if (!roomSnap.players?.[myUid]) { doLeave(); return; }

    // Update scoreTarget selector
    const sr = document.getElementById('score-row');
    if (sr && sr.querySelector('.score-opt') && !sr.querySelector('.score-opt[data-replaced]')) {
      document.querySelectorAll('.score-opt').forEach(el =>
        el.classList.toggle('sel', parseInt(el.textContent) === roomSnap.scoreTarget)
      );
    }

    // Handle active screen updates
    const activeId = document.querySelector('.screen.active')?.id;
    if (activeId === 's-lobby')        renderLobby();
    if (activeId === 's-setter-input') renderSetterInput();
    if (activeId === 's-playing')      renderPlaying();
    if (activeId === 's-round-result') renderRoundResult();

    if (!prev || prev.phase !== roomSnap.phase) handlePhase(roomSnap.phase);
  });
}

// ─── Phase handler ────────────────────────────────
function handlePhase(phase) {
  reveal2Pending = false; reveal3Pending = false;
  timeoutPending = false; roundEndPending = false;
  clearInterval(roundTimer);

  if (phase === 'lobby')        { renderLobby(); showScreen('s-lobby'); return; }
  if (phase === 'setter-input') { renderSetterInput(); showScreen('s-setter-input'); return; }
  if (phase === 'playing')      { renderPlaying(); showScreen('s-playing'); startRoundTimer(); return; }
  if (phase === 'round-result') { renderRoundResult(); showScreen('s-round-result'); return; }
  if (phase === 'end')          { renderEnd(); showScreen('s-end'); return; }
}

// ─── Lobby ───────────────────────────────────────
function renderLobby() {
  if (!roomSnap) return;
  const players = roomSnap.players || {};
  const uids    = Object.keys(players);

  document.getElementById('lobby-count').textContent = `${uids.length}/8 คน`;
  document.getElementById('lobby-room-code').textContent = roomId;

  const list = document.getElementById('lobby-players');
  list.innerHTML = '';
  uids.forEach(uid => {
    const p    = players[uid];
    const isMe = uid === myUid;
    const isCap= uid === roomSnap.host;
    const card = document.createElement('div');
    card.className = 'player-card' + (p.online ? '' : ' offline');
    card.innerHTML = `
      <div class="player-av" style="background:${p.avatarBg}">${p.avatar}</div>
      <div>
        <div class="player-name">${p.name}${isMe ? ' <span class="me-tag">(คุณ)</span>' : ''}</div>
        <div class="player-sub">${isCap ? 'Host' : (p.online ? 'ออนไลน์' : 'ออฟไลน์')}</div>
      </div>
      <div class="player-dot" style="background:${p.online?'var(--green)':'var(--muted)'}"></div>
      <span class="pbadge ${isCap?'host':''}">${isCap?'Host':'พร้อม'}</span>
    `;
    list.appendChild(card);
  });

  const startBtn = document.getElementById('start-btn');
  const hint     = document.getElementById('lobby-hint');
  if (isHost) {
    startBtn.hidden   = false;
    startBtn.disabled = uids.length < 2;
    startBtn.textContent = uids.length < 2 ? `รอเพื่อนอีก ${2-uids.length} คน...` : '▶ เริ่มเกม';
    hint.textContent = '';
  } else {
    startBtn.hidden  = true;
    hint.textContent = `รอ Host (${players[roomSnap.host]?.name || 'Host'}) เริ่มเกม`;
  }
}

// ─── Profile ─────────────────────────────────────
function goCreate() { profileMode = 'create'; buildAvatarGrid(); showScreen('s-profile'); }
function goJoin()   {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (code.length < 4) { toast('กรอกรหัสห้องให้ครบ'); return; }
  joinCodePending = code; profileMode = 'join'; buildAvatarGrid(); showScreen('s-profile');
}

async function submitProfile() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { toast('กรอกชื่อก่อน'); return; }
  myName = name;
  document.getElementById('profile-btn').disabled = true;
  try {
    if (profileMode === 'create') await createRoom();
    else await joinRoom(joinCodePending);
  } finally {
    document.getElementById('profile-btn').disabled = false;
  }
}

// ─── Create Room ──────────────────────────────────
async function createRoom() {
  let code, snap;
  do {
    code = genCode();
    snap = await db.ref(`gm_rooms/${code}`).once('value');
  } while (snap.exists());

  roomId = code; isHost = true;
  roomRef = db.ref(`gm_rooms/${roomId}`);
  scoreTarget = 15;

  await roomRef.set({
    host: myUid, phase: 'lobby', scoreTarget,
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    players: { [myUid]: playerObj() }
  });

  saveSession(); setupPresence(); listenRoom();
  renderLobby(); showScreen('s-lobby');
}

// ─── Join Room ────────────────────────────────────
async function joinRoom(code) {
  const snap = await db.ref(`gm_rooms/${code}`).once('value');
  if (!snap.exists()) { toast('ไม่พบห้องนี้'); return; }
  const d = snap.val();
  if (d.phase !== 'lobby') { toast('เกมเริ่มไปแล้ว'); return; }
  if (Object.keys(d.players || {}).length >= 8) { toast('ห้องเต็มแล้ว'); return; }

  roomId = code; isHost = false;
  roomRef = db.ref(`gm_rooms/${roomId}`);
  await roomRef.child(`players/${myUid}`).set(playerObj());

  saveSession(); setupPresence(); listenRoom();
  renderLobby(); showScreen('s-lobby');
}

// ─── Score target ─────────────────────────────────
function setScore(val, el) {
  if (!isHost) return;
  scoreTarget = val;
  document.querySelectorAll('.score-opt').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  if (roomRef) roomRef.child('scoreTarget').set(val);
}

function copyCode() {
  navigator.clipboard?.writeText(roomId).then(() => toast('คัดลอกรหัสแล้ว!')).catch(() => toast(roomId));
}

// ─── Start Game ───────────────────────────────────
async function startGame() {
  if (!isHost) return;
  const players = roomSnap?.players || {};
  const uids = Object.keys(players);
  if (uids.length < 2) { toast('ต้องการผู้เล่นอย่างน้อย 2 คน'); return; }

  // Shuffle for setter order
  const shuffled = [...uids].sort(() => Math.random() - .5);
  await roomRef.update({
    phase: 'setter-input',
    setterOrder: shuffled,
    currentSetterIdx: 0,
    currentRound: null,
    winner: null
  });
}

      </div>
      <div class="btn-stack">

async function submitHints() {
  const object = document.getElementById('inp-object')?.value.trim();
  const h1     = document.getElementById('inp-h1')?.value.trim();
  const h2     = document.getElementById('inp-h2')?.value.trim();
  const h3     = document.getElementById('inp-h3')?.value.trim();
  if (!object || !h1 || !h2 || !h3) { toast('กรอกให้ครบทุกช่อง'); return; }
  if (myUid !== getCurrentSetter()) return;

  await roomRef.update({
    phase: 'playing',
    currentRound: {
      setterId: myUid,
      object, hint1: h1, hint2: h2, hint3: h3,
      revealedLevel: 1,
      startedAt: firebase.database.ServerValue.TIMESTAMP,
      winnerId: null,
      winnerLevel: null
    }
  });
}

// ─── Playing Screen ───────────────────────────────
function renderPlaying() {
  if (!roomSnap?.currentRound) return;
  const r       = roomSnap.currentRound;
  const isSetter= myUid === r.setterId;
  const players = roomSnap.players || {};
  const el      = document.getElementById('playing-content');
  if (!el) return;

  const elapsed   = r.startedAt ? Math.max(0, Date.now() - r.startedAt) : 0;
  const remaining = Math.max(0, Math.ceil((240000 - elapsed) / 1000));
  const pct       = Math.max(0, Math.min(100, (remaining / 240) * 100));
  const urgent    = remaining <= 20;
  const level     = r.revealedLevel || 1;

  const levelLabel = level === 1
    ? `<span class="hint-phase-pill" style="background:rgba(255,63,91,.12);border:1px solid rgba(255,63,91,.25);color:var(--red)">คำใบ้ที่ 1</span>`
    : level === 2
    ? `<span class="hint-phase-pill" style="background:rgba(255,199,68,.1);border:1px solid rgba(255,199,68,.25);color:var(--gold)">คำใบ้ที่ 2</span>`
    : `<span class="hint-phase-pill" style="background:rgba(41,224,122,.1);border:1px solid rgba(41,224,122,.25);color:var(--green)">คำใบ้ที่ 3</span>`;

  const hintRows = [
    { lv: 1, text: r.hint1, label: 'คำใบ้ที่ 1', color: 'rgba(255,63,91,.35)' },
    { lv: 2, text: r.hint2, label: 'คำใบ้ที่ 2', color: 'rgba(255,199,68,.35)' },
    { lv: 3, text: r.hint3, label: 'คำใบ้ที่ 3', color: 'rgba(41,224,122,.35)' },
  ].map(h => {
    const revealed = isSetter || h.lv <= level;
    const active   = h.lv === level && h.lv <= level;
    const locked   = !revealed;
    return `
      <div class="hint-reveal-card ${active && !isSetter ? 'active' : ''} ${locked ? 'locked' : ''}">
        <div class="hint-reveal-label" style="${h.lv <= level || isSetter ? `color:${h.color}` : ''}">${h.label}</div>
        <div class="hint-reveal-text">${revealed ? h.text : '???'}</div>
      </div>
    `;
  }).join('');

  if (isSetter) {
    // Setter sees all hints + player list to confirm answer
    const guessers = Object.entries(players).filter(([uid]) => uid !== r.setterId);
    const playerButtons = guessers.map(([uid, p]) => `
      <div class="confirm-player" onclick="confirmWinner('${uid}')">
        <div class="confirm-player-av" style="background:${p.avatarBg}">${p.avatar}</div>
        <div>
          <div class="confirm-player-name">${p.name}</div>
          <div style="font-size:.72rem;color:var(--muted)">${p.score||0} แต้ม</div>
        </div>
        <div style="margin-left:auto;font-size:.8rem;color:var(--green);font-weight:600">✓ ถูก</div>
      </div>
    `).join('');

    el.innerHTML = `
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div>${levelLabel}</div>
          <div class="timer-display ${urgent?'urgent':''}" style="font-size:1.6rem">${remaining}s</div>
        </div>
        <div class="timer-bar-wrap"><div class="timer-bar ${urgent?'urgent':''}" id="timer-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="object-card" style="margin-bottom:12px">
        <div class="object-label">สิ่งที่นึกถึง (เฉพาะคุณเห็น)</div>
        <div class="object-text">${r.object}</div>
      </div>
      ${hintRows}
      <div class="confirm-panel" style="margin-top:4px">
        <div class="confirm-title">ใครตอบถูก?</div>
        ${playerButtons}
      </div>
      <div class="btn-stack" style="padding-top:12px">
        <button class="btn btn-ghost" style="font-size:.88rem;padding:12px;color:var(--muted)" onclick="confirmTimeout()">⏱ หมดเวลา — ไม่มีใครทาย</button>
        <button class="btn btn-ghost" onclick="leaveRoom()" style="font-size:.82rem;padding:10px;opacity:.5">ออกจากห้อง</button>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div>${levelLabel}</div>
          <div class="timer-display ${urgent?'urgent':''}" id="timer-num">${remaining}s</div>
        </div>
        <div class="timer-bar-wrap"><div class="timer-bar ${urgent?'urgent':''}" id="timer-bar" style="width:${pct}%"></div></div>
      </div>
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:.78rem;color:var(--muted);margin-bottom:4px">ตั้งโดย</div>
        <div style="font-family:'Kanit',sans-serif;font-weight:700">${players[r.setterId]?.name||'?'}</div>
      </div>
      ${hintRows}
      <div id="next-hint-info" style="text-align:center;margin:10px 0 4px;font-size:.82rem;color:var(--gold);font-weight:600;min-height:1.2em"></div>
      <div style="text-align:center;padding:8px 0 16px;color:var(--muted);font-size:.88rem">
        ตะโกนตอบสดๆ ในวง!<br>
        <span style="font-size:.78rem">ถ้าถูก Setter กดยืนยัน</span>
      </div>
      <div class="btn-stack">
        <button class="btn btn-ghost" onclick="leaveRoom()" style="font-size:.82rem;padding:10px;opacity:.6">ออกจากห้อง</button>
      </div>
    `;
  }
}

// ─── Round Timer ──────────────────────────────────
function startRoundTimer() {
  clearInterval(roundTimer);
  roundTimer = setInterval(() => {
    const r = roomSnap?.currentRound;
    if (!r || !r.startedAt) return;

    const elapsed   = Math.max(0, Date.now() - r.startedAt);
    const remaining = Math.max(0, Math.ceil((240000 - elapsed) / 1000));
    const pct       = Math.max(0, Math.min(100, (remaining / 240) * 100));
    const urgent    = remaining <= 20;

    // Update timer display
    const numEl = document.getElementById('timer-num');
    const barEl = document.getElementById('timer-bar');
    if (numEl) {
      numEl.textContent = remaining + 's';
      numEl.className = 'timer-display' + (urgent ? ' urgent' : '');
    }
    if (barEl) {
      barEl.style.width = pct + '%';
      barEl.className = 'timer-bar' + (urgent ? ' urgent' : '');
    }

    // Update next-hint countdown for guessers
    const nextHintEl = document.getElementById('next-hint-info');
    if (nextHintEl) {
      const lv = r.revealedLevel || 1;
      if (lv === 1) {
        const nxt = Math.max(0, Math.ceil((40000 - elapsed) / 1000));
        nextHintEl.textContent = nxt > 0 ? `⏳ คำใบ้ที่ 2 เปิดใน ${nxt}s` : '';
      } else if (lv === 2) {
        const nxt = Math.max(0, Math.ceil((120000 - elapsed) / 1000));
        nextHintEl.textContent = nxt > 0 ? `⏳ คำใบ้ที่ 3 เปิดใน ${nxt}s` : '';
      } else {
        nextHintEl.textContent = '';
      }
    }

    // Host: auto-reveal hints
    if (isHost) {
      if (elapsed >= 40000 && (r.revealedLevel || 1) < 2 && !reveal2Pending) {
        reveal2Pending = true;
        roomRef.child('currentRound/revealedLevel').set(2);
      }
      if (elapsed >= 120000 && (r.revealedLevel || 1) < 3 && !reveal3Pending) {
        reveal3Pending = true;
        roomRef.child('currentRound/revealedLevel').set(3);
      }
      if (elapsed >= 240000 && !timeoutPending) {
        timeoutPending = true;
        endRound(null);
      }
    }
  }, 500);
}

// ─── End Round ────────────────────────────────────
async function confirmWinner(uid) {
  if (myUid !== roomSnap?.currentRound?.setterId) return;
  if (roundEndPending) return;
  roundEndPending = true;
  await endRound(uid);
}

async function confirmTimeout() {
  if (myUid !== roomSnap?.currentRound?.setterId) return;
  if (roundEndPending) return;
  roundEndPending = true;
  await endRound(null);
}

async function endRound(winnerId) {
  if (!roomSnap?.currentRound) { roundEndPending = false; return; }
  const r       = roomSnap.currentRound;
  const level   = winnerId ? (r.revealedLevel || 1) : null;
  const { guesserScore, setterScore } = calcScore(level);
  const players = roomSnap.players || {};
  const setter  = r.setterId;

  const updates = {};

  // Apply scores
  if (winnerId) {
    const newG = (players[winnerId]?.score || 0) + guesserScore;
    updates[`players/${winnerId}/score`] = newG;
  }
  const newS = Math.max(0, (players[setter]?.score || 0) + setterScore);
  updates[`players/${setter}/score`] = newS;

  // Store round result
  updates['currentRound/winnerId']    = winnerId || null;
  updates['currentRound/winnerLevel'] = level;

  // Check game winner (computed from updated scores)
  const target   = roomSnap.scoreTarget;
  let gameWinner = null;
  if (winnerId && ((players[winnerId]?.score || 0) + guesserScore) >= target) gameWinner = winnerId;
  if (!gameWinner && (Math.max(0, (players[setter]?.score || 0) + setterScore)) >= target) gameWinner = setter;

  // Advance setter index
  const nextIdx = (roomSnap.currentSetterIdx || 0) + 1;
  updates['currentSetterIdx'] = nextIdx;
  if (gameWinner) updates['winner'] = gameWinner;
  updates['phase'] = 'round-result';

  clearInterval(roundTimer);
  await roomRef.update(updates);
}

// ─── Round Result ─────────────────────────────────
function renderRoundResult() {
  if (!roomSnap?.currentRound) return;
  const r       = roomSnap.currentRound;
  const players = roomSnap.players || {};
  const winner  = r.winnerId;
  const level   = r.winnerLevel;
  const setter  = r.setterId;
  const sp      = players[setter] || {};
  const { guesserScore, setterScore, gLabel, sLabel } = calcScore(level);

  const el = document.getElementById('round-result-content');
  if (!el) return;

  // Verdict block
  let verdictHtml;
  if (winner) {
    const wp = players[winner] || {};
    verdictHtml = `
      <div class="result-verdict">
        <div class="result-verdict-emoji">${wp.avatar || '?'}</div>
        <div class="result-verdict-title">${wp.name} ทายถูก!</div>
        <div style="font-size:.85rem;color:var(--muted)">คำใบ้ที่ ${level}</div>
        <div class="result-label genius">${gLabel}</div>
      </div>`;
  } else {
    verdictHtml = `
      <div class="result-verdict">
        <div class="result-verdict-emoji">🏆</div>
        <div class="result-verdict-title">ไม่มีใครทาย!</div>
        <div style="font-size:.85rem;color:var(--muted)">หมดเวลา</div>
        <div class="result-label tricked">${sLabel}</div>
      </div>`;
  }

  // Object reveal
  const objectHtml = `
    <div class="object-card">
      <div class="object-label">สิ่งที่ ${sp.name||'?'} นึกถึง</div>
      <div class="object-text">${r.object || '?'}</div>
    </div>`;

  // Hints reveal
  const hintsHtml = `
    <div class="section-label">คำใบ้ทั้งหมด</div>
    <div class="hint-reveal-row">
      <div class="hint-mini"><div class="hint-mini-lv lv1" style="color:var(--red)">1</div><div class="hint-mini-txt">${r.hint1||''}</div></div>
      <div class="hint-mini"><div class="hint-mini-lv lv2" style="color:var(--gold)">2</div><div class="hint-mini-txt">${r.hint2||''}</div></div>
      <div class="hint-mini"><div class="hint-mini-lv lv3" style="color:var(--green)">3</div><div class="hint-mini-txt">${r.hint3||''}</div></div>
    </div>`;

  // Score changes
  const setterDelta = setterScore > 0 ? `+${setterScore}` : setterScore < 0 ? `${setterScore}` : '±0';
  const setterClass = setterScore > 0 ? 'plus' : setterScore < 0 ? 'minus' : 'zero';
  const guesserDelta = winner ? `+${guesserScore}` : '0';

  const scoresHtml = `
    <div class="section-label">คะแนนรอบนี้</div>
    <div class="result-score-row">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:8px;background:${sp.avatarBg};display:flex;align-items:center;justify-content:center;font-size:1rem">${sp.avatar}</div>
        <div>
          <div style="font-weight:600;font-size:.88rem">${sp.name} <span style="font-size:.72rem;color:var(--muted)">(ตั้งคำ)</span></div>
          ${sLabel ? `<div style="font-size:.72rem;color:var(--muted)">${sLabel}</div>` : ''}
        </div>
      </div>
      <div class="score-delta ${setterClass}">${setterDelta}</div>
    </div>
    ${winner ? (() => {
      const wp = players[winner] || {};
      return `<div class="result-score-row">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:8px;background:${wp.avatarBg};display:flex;align-items:center;justify-content:center;font-size:1rem">${wp.avatar}</div>
          <div>
            <div style="font-weight:600;font-size:.88rem">${wp.name} <span style="font-size:.72rem;color:var(--muted)">(ทาย)</span></div>
            ${gLabel ? `<div style="font-size:.72rem;color:var(--purple)">${gLabel}</div>` : ''}
          </div>
        </div>
        <div class="score-delta plus">${guesserDelta}</div>
      </div>`;
    })() : ''}`;

  // Scoreboard
  const sorted = Object.entries(players).sort(([,a],[,b]) => (b.score||0)-(a.score||0));
  const boardHtml = `
    <div class="section-label" style="margin-top:4px">คะแนนสะสม</div>
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px">
      ${sorted.map(([uid, p], i) => `
        <div class="score-row-item">
          <div class="score-rank">${['🥇','🥈','🥉'][i] || (i+1)}</div>
          <div style="width:32px;height:32px;border-radius:8px;background:${p.avatarBg};display:flex;align-items:center;justify-content:center;font-size:1rem">${p.avatar}</div>
          <div style="font-weight:600;font-size:.9rem">${p.name}${uid===myUid?' <span class="me-tag">(คุณ)</span>':''}</div>
          <div class="score-pts">${p.score||0}</div>
        </div>`).join('')}
    </div>`;

  // Actions
  const hasWinner = !!roomSnap.winner;
  const actionsHtml = isHost
    ? `<div class="btn-stack" style="padding-top:0">
        ${hasWinner
          ? `<button class="btn btn-gold" onclick="handlePhase('end')">🏆 ดูผลสรุป</button>`
          : `<button class="btn btn-green" onclick="nextSetterRound()">▶ รอบต่อไป</button>`}
        <button class="btn btn-ghost" onclick="leaveRoom()" style="font-size:.85rem;padding:11px">ออกจากห้อง</button>
       </div>`
    : `<div class="btn-stack" style="padding-top:0">
        <div style="text-align:center;font-size:.82rem;color:var(--muted);padding:8px 0">${hasWinner ? '🏆 มีผู้ชนะแล้ว! รอ Host...' : 'รอ Host เริ่มรอบต่อไป...'}</div>
        <button class="btn btn-ghost" onclick="leaveRoom()" style="font-size:.85rem;padding:11px">ออกจากห้อง</button>
       </div>`;

  el.innerHTML = verdictHtml + objectHtml + hintsHtml + scoresHtml + boardHtml + actionsHtml;
}

// ─── Next setter / next round ─────────────────────
async function nextSetterRound() {
  if (!isHost) return;
  const order  = roomSnap.setterOrder || [];
  const idx    = roomSnap.currentSetterIdx || 0;

  if (idx >= order.length) {
    // Everyone has had a turn — reshuffle for next lap
    const players  = roomSnap.players || {};
    const shuffled = Object.keys(players).sort(() => Math.random() - .5);
    await roomRef.update({
      setterOrder: shuffled,
      currentSetterIdx: 0,
      currentRound: null,
      phase: 'setter-input'
    });
  } else {
    await roomRef.update({
      currentRound: null,
      phase: 'setter-input'
    });
  }
}

// ─── End screen ───────────────────────────────────
function renderEnd() {
  if (!roomSnap) return;
  const players  = roomSnap.players || {};
  const winnerId = roomSnap.winner;
  const wp       = players[winnerId] || {};
  const sorted   = Object.entries(players).sort(([,a],[,b]) => (b.score||0)-(a.score||0));

  const rows = sorted.map(([uid, p], i) => `
    <div class="end-rank-row ${uid===winnerId?'winner-row':''}">
      <div class="rank-medal">${['🥇','🥈','🥉'][i] || (i+1)}</div>
      <div style="width:40px;height:40px;border-radius:11px;background:${p.avatarBg};display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">${p.avatar}</div>
      <div>
        <div class="end-player-name">${p.name}${uid===myUid?' <span class="me-tag">(คุณ)</span>':''}</div>
      </div>
      <div class="end-score-num" style="${uid===winnerId?'color:var(--gold)':''}">${p.score||0}</div>
    </div>`).join('');

  const el = document.getElementById('end-content');
  if (!el) return;
  el.innerHTML = `
    <div class="winner-banner">
      <div style="font-size:4rem;margin-bottom:10px">${wp.avatar||'🏆'}</div>
      <div class="screen-title" style="font-size:1.6rem;margin-bottom:4px">🎉 จบเกม!</div>
      <div style="font-family:'Kanit',sans-serif;font-weight:700;font-size:1.3rem;color:var(--gold)">${wp.name||'?'} ชนะ!</div>
      <div style="font-size:.82rem;color:var(--muted);margin-top:4px">ถึง ${roomSnap.scoreTarget} แต้มก่อนใคร</div>
    </div>
    <div class="section-label">ตารางคะแนนสุดท้าย</div>
    <div style="margin-bottom:20px">${rows}</div>
    <div class="btn-stack">
      ${isHost ? '<button class="btn btn-green" onclick="restartGame()">▶ เล่นใหม่</button>' : '<div style="text-align:center;font-size:.82rem;color:var(--muted);padding:8px 0">รอ Host เล่นใหม่...</div>'}
      <button class="btn btn-ghost" onclick="leaveRoom()">🏠 กลับหน้าแรก</button>
    </div>`;
}

async function restartGame() {
  if (!isHost) return;
  const players  = roomSnap?.players || {};
  const shuffled = Object.keys(players).sort(() => Math.random() - .5);
  const updates  = { phase: 'setter-input', setterOrder: shuffled, currentSetterIdx: 0, currentRound: null, winner: null };
  Object.keys(players).forEach(uid => { updates[`players/${uid}/score`] = 0; });
  await roomRef.update(updates);
}

// ─── Leave room ───────────────────────────────────
function leaveRoom() {
  if (!roomRef) { showScreen('s-home'); return; }
  roomRef.child(`players/${myUid}/online`).set(false).then(doLeave);
}

function doLeave() {
  clearInterval(roundTimer);
  if (roomRef) roomRef.off();
  roomRef = null; roomId = null; isHost = false; roomSnap = null;
  clearSession();
  showScreen('s-home');
}
